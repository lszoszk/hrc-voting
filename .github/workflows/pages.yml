name: Deploy dashboard to GitHub Pages

# Publishes the static dashboard (dashboard/) — the two-file build index.html +
# data.js + world.js — to GitHub Pages on every push to main, together with the
# crawlable per-country and per-resolution pages generated from data/csv/ (nothing
# generated is committed).

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/csv/resolutions.csv"
      - "data/csv/votes_long.csv"
      - "scripts/build_static_pages.py"
      - "scripts/check_static_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push cancel an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the static country and resolution pages
        run: |
          python3 scripts/build_static_pages.py --out dashboard
          python3 scripts/check_static_pages.py dashboard --base /hrc-voting
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
